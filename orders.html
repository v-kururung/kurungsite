<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="CSS/style.css">
<style>
/* ───── 주문내역 ───── */
.osum{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:16px}
.ochip{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;
  padding:6px 14px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);color:var(--sub)}
.ochip b{font-size:17px;color:var(--pink-text)}
.ochip.done b{color:var(--sub)}
.osearch{margin-left:auto;flex:0 1 220px;min-width:150px}
.osearch input{width:100%;padding:9px 15px;border:1px solid var(--line);border-radius:20px;
  background:var(--card);font-family:var(--body);font-size:15px;color:var(--ink)}
.osearch input:focus{outline:2px solid var(--pink);outline-offset:-1px;border-color:transparent}

.olist{display:flex;flex-direction:column;gap:11px}
.ocard{background:var(--card);border-radius:20px;padding:18px 22px;box-shadow:var(--shadow);
  border:1.5px solid transparent}
.ocard.clear{border-color:var(--line);box-shadow:none;background:transparent}

.ohead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.oface{width:46px;height:46px;border-radius:50%;flex:0 0 auto;overflow:hidden;
  background:var(--pink-soft);display:grid;place-items:center;
  font-family:var(--disp);font-size:20px;color:var(--pink-text)}
.oface img{width:100%;height:100%;object-fit:cover;display:block}
.oname{font-family:var(--disp);font-size:21px;color:var(--ink);line-height:1.2}
.oid{font-size:14px;color:var(--sub);margin-left:6px}
.ocount{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.obadge{font-size:14px;font-weight:700;padding:3px 12px;border-radius:20px;
  color:var(--pink-text);background:var(--pink-soft);border:1px solid var(--pink);white-space:nowrap}
.obadge.done{color:var(--sub);background:var(--page);border-color:var(--line);font-weight:600}

.owait{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:7px}
.oitem{display:grid;grid-template-columns:78px 1fr;gap:14px;align-items:baseline;
  font-size:16px}
.oitem .d{font-family:var(--disp);font-size:15px;color:var(--sub)}
.oitem .n{font-family:var(--disp);font-size:18px;color:var(--ink);word-break:keep-all}
.oitem .memo{font-family:var(--body);font-size:14px;color:var(--sub);margin-left:7px}
.oitem .swap{color:var(--pink-text)}

/* 완료 목록 — 접었다 펼칩니다 */
.odone{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
.otoggle{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;
  font-family:var(--body);font-size:14px;font-weight:600;color:var(--sub);cursor:pointer}
.otoggle:hover{color:var(--pink-text)}
.otoggle .arw{font-size:11px;transition:transform .18s}
.otoggle.on .arw{transform:rotate(180deg)}
.odlist{display:none;flex-direction:column;gap:6px;margin-top:11px}
.odlist.on{display:flex}
.odlist .oitem{opacity:.72}
.odlist .oitem .n{font-size:17px}
.odlist .at{font-size:14px;color:var(--sub);margin-left:7px;white-space:nowrap}

/* 내 요청 작성 */
.mybox{background:var(--card);border-radius:20px;padding:20px 22px;box-shadow:var(--shadow);
  margin-bottom:18px;border:1.5px solid var(--pink)}
.mybox h3{font-family:var(--disp);font-size:20px;color:var(--ink);margin-bottom:6px}
.mybox .desc{font-size:14px;color:var(--sub);line-height:1.6;margin-bottom:13px}
.myform{display:flex;gap:8px;flex-wrap:wrap}
.myform input{flex:1;min-width:150px;padding:10px 15px;border:1px solid var(--line);
  border-radius:20px;background:var(--page);font-family:var(--body);font-size:16px;
  letter-spacing:2px;text-transform:uppercase;color:var(--ink)}
.myform input:focus{outline:2px solid var(--pink);outline-offset:-1px;border-color:transparent}
.mybtn{padding:10px 22px;border:0;border-radius:20px;background:var(--pink);
  font-family:var(--body);font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;
  transition:background .18s}
.mybtn:hover{background:var(--pink-deep);color:#fff}
.mybtn.sub{background:var(--page);border:1px solid var(--line);color:var(--sub);font-weight:600}
.myerr{margin-top:10px;font-size:14px;color:#d64545}

.myitem{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.myitem .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px}
.myitem .nm{font-family:var(--disp);font-size:19px;color:var(--ink)}
.myitem .dt{font-size:14px;color:var(--sub)}
.myitem .st{margin-left:auto;font-size:14px;font-weight:700;padding:2px 11px;border-radius:20px;
  color:var(--pink-text);background:var(--pink-soft);border:1px solid var(--pink)}
.myitem .st.ok{color:var(--sub);background:var(--page);border-color:var(--line)}
.myitem .guide{font-size:14px;color:var(--sub);margin-bottom:7px}
.myitem textarea{width:100%;min-height:82px;padding:11px 14px;border:1px solid var(--line);
  border-radius:12px;background:var(--page);font-family:var(--body);font-size:16px;
  line-height:1.6;color:var(--ink);resize:vertical}
.myitem textarea:focus{outline:2px solid var(--pink);outline-offset:-1px;border-color:transparent}
.myitem textarea:disabled{opacity:.7;cursor:not-allowed}
.myitem .act{display:flex;align-items:center;gap:9px;margin-top:8px}
.myitem .msg{font-size:14px;color:var(--sub)}

.oempty{text-align:center;padding:52px 0;color:var(--sub)}
.oempty .emo{font-size:40px;margin-bottom:10px}
.onote{margin-top:18px;font-size:14px;color:var(--sub);line-height:1.7;text-align:center}

@media(max-width:680px){
  .odlist .at{display:block;margin-left:0}
  .ocard{padding:15px 16px;border-radius:16px}
  .oface{width:40px;height:40px;font-size:17px}
  .oname{font-size:19px}
  .ocount{margin-left:0;width:100%}
  .oitem{grid-template-columns:66px 1fr;gap:10px}
  .osearch{margin-left:0;flex:1 1 100%}
}
</style>
</head>
<body>

<div id="sky"></div>
<header class="top"></header>

<main class="content"><div class="wrap">
  <div class="mhead">
    <div class="en">Orders</div>
    <h2>주문내역</h2>
  </div>

  <div class="mybox" id="myBox">
    <h3>내 요청 작성하기</h3>
    <p class="desc">프사·방편처럼 원하는 내용을 적어야 하는 항목이 있어요.<br>
      방송에서 받은 <b>코드</b>를 넣으면 나만 볼 수 있는 작성칸이 열립니다.</p>
    <div class="myform">
      <input id="myCode" placeholder="코드 8자리" maxlength="8" autocomplete="off" spellcheck="false">
      <button class="mybtn" id="myGo" type="button">열기</button>
    </div>
    <div id="myOut"></div>
  </div>

  <div class="osum" id="oSum"></div>
  <div class="olist" id="oList"></div>
  <p class="onote" id="oNote" style="display:none"></p>
</div></main>

<footer></footer>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
initPage('orders.html');

var oList = document.getElementById('oList');
var oSum  = document.getElementById('oSum');

/* SOOP 프로필 사진 주소 규칙 — 아이디 앞 두 글자로 폴더가 나뉩니다 */
function faceUrl(id){
  if(!id || id.length < 2) return '';
  return 'https://profile.img.sooplive.com/LOGO/'+id.slice(0,2)+'/'+id+'/'+id+'.jpg';
}

/* 2026-08-02 15:01:50 → 8월 2일 */
function niceDate(s){
  var m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? (+m[2])+'월 '+(+m[3])+'일' : '';
}

/* 며칠 기다렸는지 */
function waited(s){
  var m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return 0;
  var d = new Date(+m[1], +m[2]-1, +m[3]);
  var now = new Date(); now.setHours(0,0,0,0);
  return Math.round((now - d) / 86400000);
}

function card(d){
  var face = faceUrl(d.donor_id);
  var initial = esc((d.donor_name||'?').trim().charAt(0));

  var badges = '';
  if(d.pending) badges += '<span class="obadge">대기 '+d.pending+'</span>';
  if(d.done)    badges += '<span class="obadge done">완료 '+d.done+'</span>';

  function line(it, withDone){
    var name = it.resolved_label
      ? esc(it.label)+' <span class="swap">→ '+esc(it.resolved_label)+'</span>'
      : esc(it.label);
    var memo = it.memo ? '<span class="memo">'+esc(it.memo)+'</span>' : '';
    var at = (withDone && it.done_at)
      ? '<span class="at">'+niceDate(it.done_at)+' 완료</span>' : '';
    return '<div class="oitem"><span class="d">'+niceDate(it.donated_at)+'</span>'
         + '<span class="n">'+name+memo+at+'</span></div>';
  }

  var wait = '';
  if(d.items.length){
    wait = '<div class="owait">' + d.items.map(function(it){ return line(it, false); }).join('') + '</div>';
  }

  /* 완료한 것도 볼 수 있게. 처음엔 접혀 있습니다 */
  var done = '';
  if(d.done_items && d.done_items.length){
    done = '<div class="odone">'
         +   '<button class="otoggle" type="button">'
         +     '완료한 '+d.done_items.length+'건 보기 <span class="arw">▾</span>'
         +   '</button>'
         +   '<div class="odlist">'
         +     d.done_items.map(function(it){ return line(it, true); }).join('')
         +   '</div>'
         + '</div>';
  }

  return '<div class="ocard'+(d.pending?'':' clear')+'">'
       +   '<div class="ohead">'
       +     '<div class="oface">'
       +       (face ? '<img src="'+esc(face)+'" alt="" loading="lazy" '
       +               +'onerror="this.parentNode.textContent=\''+initial+'\'">' : initial)
       +     '</div>'
       +     '<div><span class="oname">'+esc(d.donor_name||d.donor_id)+'</span>'
       +       '<span class="oid">'+esc(d.donor_id)+'</span></div>'
       +     '<div class="ocount">'+badges+'</div>'
       +   '</div>'
       +   wait
       +   done
       + '</div>';
}

async function load(q){
  oList.innerHTML = '<div class="oempty">불러오는 중…</div>';
  try{
    var res = await fetch(API+'/roulette/donors'+(q?('?q='+encodeURIComponent(q)):''));
    if(!res.ok) throw new Error('HTTP '+res.status);
    var data = await res.json();
    var list = data.donors || [];

    if(list.length === 0){
      oList.innerHTML = '<div class="oempty"><div class="emo">🌙</div>'
        + '<h3>'+(q ? '찾는 분이 없어요' : '아직 내역이 없어요')+'</h3></div>';
      return;
    }

    oList.innerHTML = list.map(card).join('');

    oList.querySelectorAll('.otoggle').forEach(function(b){
      var shut = b.firstChild.textContent;          /* '완료한 12건 보기 ' */
      b.addEventListener('click', function(){
        var box = b.parentNode.querySelector('.odlist');
        var open = box.classList.toggle('on');
        b.classList.toggle('on', open);
        b.firstChild.textContent = open ? '완료한 항목 접기 ' : shut;
      });
    });

    /* 가장 오래 기다린 분 안내 */
    var top = list[0];
    var note = document.getElementById('oNote');
    if(top && top.pending && top.oldest_pending){
      var days = waited(top.oldest_pending);
      note.style.display = '';
      note.textContent = days > 0
        ? '가장 오래 기다린 숙제는 ' + days + '일째예요. 위에서부터 순서대로 해드릴게요 🌿'
        : '오늘 들어온 숙제부터 차근차근 해드릴게요 🌿';
    }
  }catch(e){
    oList.innerHTML = '<div class="oempty">잠시 후 다시 시도해 주세요</div>';
  }
}

async function loadSum(){
  try{
    var r = await fetch(API+'/roulette/stats');
    var s = await r.json();
    oSum.innerHTML =
        '<span class="ochip">남은 숙제 <b>'+(s.pending||0)+'</b></span>'
      + '<span class="ochip done">완료 <b>'+(s.done||0)+'</b></span>'
      + '<span class="osearch"><input id="oQ" placeholder="닉네임 검색" autocomplete="off"></span>';

    var el = document.getElementById('oQ'), t;
    el.addEventListener('input', function(){
      clearTimeout(t);
      t = setTimeout(function(){ load(el.value.trim()); }, 300);
    });
  }catch(e){ }
}

/* ───── 내 요청 작성 ───── */

var myOut = document.getElementById('myOut');
var myCodeEl = document.getElementById('myCode');

function myItemHtml(it, i){
  var locked = it.locked;
  return '<div class="myitem" data-i="'+i+'">'
    +   '<div class="top">'
    +     '<span class="nm">'+esc(it.label)+'</span>'
    +     '<span class="dt">'+niceDate(it.donated_at)+'</span>'
    +     '<span class="st'+(locked?' ok':'')+'">'+(locked?'처리 완료':'작성 가능')+'</span>'
    +   '</div>'
    +   (it.input_label ? '<p class="guide">'+esc(it.input_label)+'</p>' : '')
    +   '<textarea maxlength="1000" placeholder="'
    +     (locked ? '이미 처리된 항목이라 고칠 수 없어요' : '원하는 내용을 적어주세요')
    +     '"'+(locked?' disabled':'')+'>'+esc(it.request||'')+'</textarea>'
    +   (locked ? '' :
        '<div class="act"><button class="mybtn" type="button" data-save="'+i+'">저장</button>'
      + '<span class="msg" data-msg="'+i+'">'
      + (it.request_at ? '마지막 저장 '+String(it.request_at).slice(0,16) : '')
      + '</span></div>')
    + '</div>';
}

var myData = null;

async function myOpen(){
  var code = myCodeEl.value.trim().toUpperCase();
  if(code.length !== 8){ myOut.innerHTML = '<p class="myerr">코드 8자리를 넣어주세요</p>'; return; }

  myOut.innerHTML = '<p class="myerr" style="color:var(--sub)">확인 중…</p>';
  try{
    var r = await fetch(API+'/roulette/my?code='+encodeURIComponent(code));
    if(r.status === 404 || r.status === 400){
      myOut.innerHTML = '<p class="myerr">코드를 찾을 수 없어요. 다시 확인해 주세요</p>';
      return;
    }
    if(!r.ok) throw new Error('HTTP '+r.status);
    myData = await r.json();

    if(!myData.items.length){
      myOut.innerHTML = '<p class="myerr" style="color:var(--sub)">지금은 작성할 항목이 없어요</p>';
      return;
    }

    myOut.innerHTML = myData.items.map(myItemHtml).join('');

    myOut.querySelectorAll('button[data-save]').forEach(function(b){
      b.addEventListener('click', function(){ mySave(Number(b.dataset.save), code, b); });
    });
  }catch(e){
    myOut.innerHTML = '<p class="myerr">잠시 후 다시 시도해 주세요</p>';
  }
}

async function mySave(i, code, btn){
  var box = myOut.querySelector('.myitem[data-i="'+i+'"]');
  var ta  = box.querySelector('textarea');
  var msg = box.querySelector('[data-msg="'+i+'"]');
  var it  = myData.items[i];

  btn.disabled = true;
  msg.textContent = '저장 중…';
  try{
    var r = await fetch(API+'/roulette/my', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ code: code, order_idx: it.order_idx, seq: it.seq, request: ta.value })
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    msg.textContent = '저장했어요 🌿';
  }catch(e){
    msg.textContent = '저장하지 못했어요';
  }
  btn.disabled = false;
}

document.getElementById('myGo').addEventListener('click', myOpen);
myCodeEl.addEventListener('keydown', function(e){ if(e.key==='Enter') myOpen(); });

loadSum();
load('');
</script>
</body>
</html>
