<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="CSS/style.css">
<style>
/* ───── 상단 요약 ───── */
.osum{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:16px}
.ochip{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;
  padding:6px 14px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);color:var(--sub)}
.ochip b{font-size:17px;color:var(--pink-text)}
.ochip.done b{color:var(--sub)}
.osearch{margin-left:auto;flex:0 1 220px;min-width:150px}
.osearch input{width:100%;padding:9px 15px;border:1px solid var(--line);border-radius:20px;
  background:var(--card);font-family:var(--body);font-size:15px;color:var(--ink)}
.osearch input:focus{outline:2px solid var(--pink);outline-offset:-1px;border-color:transparent}

/* ───── 후원자 카드 ───── */
.olist{display:flex;flex-direction:column;gap:11px}
.ocard{background:var(--card);border-radius:20px;padding:18px 22px;box-shadow:var(--shadow);
  border:1.5px solid transparent}
.ocard.clear{border-color:var(--line);box-shadow:none;background:transparent}

.ohead{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.oface{width:46px;height:46px;border-radius:50%;flex:0 0 auto;overflow:hidden;
  background:var(--pink-soft);display:grid;place-items:center;
  font-family:var(--disp);font-size:20px;color:var(--pink-text)}
.oface img{width:100%;height:100%;object-fit:cover;display:block}
.oname{font-family:var(--disp);font-size:21px;color:var(--ink);line-height:1.2}
.oid{font-size:14px;color:var(--sub);margin-left:6px}

/* 요청사항 작성하기 */
.oask{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--pink);
  background:var(--card);border-radius:7px;padding:5px 12px;cursor:pointer;
  font-family:var(--body);font-size:14px;font-weight:600;color:var(--pink-text);
  transition:background .18s,color .18s}
.oask:hover{background:var(--pink);color:var(--ink)}
.ocard[data-open="1"] .oask{display:none}

/* 대기 / 완료 / 전체 */
.ocount{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.obadge{font-family:var(--body);font-size:14px;font-weight:600;padding:4px 12px;
  border-radius:7px;white-space:nowrap;cursor:pointer;
  color:var(--sub);background:var(--page);border:1px solid var(--line);
  transition:background .15s,color .15s,border-color .15s}
.obadge:hover{border-color:var(--sub2)}
.ocard[data-mode="pending"] .obadge[data-mode="pending"],
.ocard[data-mode="done"]    .obadge[data-mode="done"],
.ocard[data-mode="all"]     .obadge[data-mode="all"]{
  color:var(--pink-text);background:var(--pink-soft);border-color:var(--pink)}

/* ───── 항목 목록 ───── */
.owait{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:7px}
.oitem{display:grid;grid-template-columns:78px 1fr;gap:14px;align-items:baseline;font-size:16px}
.oitem .d{font-family:var(--disp);font-size:15px;color:var(--sub)}
.oitem .n{font-family:var(--disp);font-size:18px;color:var(--ink);word-break:keep-all}
.oitem .memo{font-family:var(--body);font-size:14px;color:var(--sub);margin-left:7px}
.oitem .swap{color:var(--pink-text)}
.oitem .at{font-family:var(--body);font-size:14px;color:var(--sub);margin-left:7px;white-space:nowrap}
/* 여러 줄에 반복되는 표시라 눈에 덜 걸리도록 조용하게 둡니다 */
.oneed{display:inline-block;margin-left:8px;font-family:var(--body);font-size:14px;font-weight:500;
  color:var(--sub);background:var(--page);border:1px solid var(--line);
  padding:0 7px;border-radius:5px;line-height:1.6;vertical-align:middle}

.ocard[data-mode="pending"] [data-list="done"],
.ocard[data-mode="done"]    [data-list="pending"]{display:none}
.odlist .oitem{opacity:.72}
.oblank{font-size:15px;color:var(--sub);opacity:.8;padding:2px 0}

/* ───── 코드 입력 ───── */
.oauth{display:none;margin-top:13px;padding:14px 16px;border-radius:14px;
  background:var(--pink-soft);border:1px solid var(--pink)}
.ocard[data-open="1"] .oauth{display:block}
.oauth p{font-size:14px;color:var(--ink);line-height:1.6;margin-bottom:10px}
.oauth .row{display:flex;gap:8px;flex-wrap:wrap}
.oauth input{flex:1;min-width:140px;padding:9px 15px;border:1px solid var(--line);
  border-radius:20px;background:var(--card);font-family:var(--body);font-size:16px;
  letter-spacing:2px;text-transform:uppercase;color:var(--ink)}
.oauth input:focus{outline:2px solid var(--pink);outline-offset:-1px;border-color:transparent}
.obtn{padding:9px 20px;border:0;border-radius:20px;background:var(--pink);
  font-family:var(--body);font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;
  transition:background .18s,color .18s}
.obtn:hover{background:var(--pink-deep);color:#fff}
.obtn.sub{background:var(--card);border:1px solid var(--line);color:var(--sub);font-weight:600}
.oauth .err{margin-top:9px;font-size:14px;color:#d64545}

/* ───── 요청 작성칸 ───── */
.oform{grid-column:1/-1;margin:2px 0 4px;padding:14px 16px;border-radius:14px;
  background:var(--page);border:1px solid var(--line)}
.oform.saved{border-color:var(--pink);background:var(--pink-soft)}
.oform .guide{font-size:15px;line-height:1.55;color:var(--ink);
  background:var(--accent-soft);border-radius:10px;padding:9px 13px;margin-bottom:9px}
.oform textarea{display:block;width:100%;min-height:92px;padding:12px 15px;
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  font-family:var(--body);font-size:16px;line-height:1.65;color:var(--ink);resize:vertical}
.oform textarea::placeholder{color:var(--sub);opacity:.75}
.oform textarea:focus{outline:2px solid var(--pink);outline-offset:-1px;border-color:transparent}
.oform .act{display:flex;align-items:center;gap:10px;margin-top:10px}
.oform .msg{font-size:14px;color:var(--sub)}
.oform .msg.ok{color:var(--pink-text);font-weight:600}
.oform .len{margin-left:auto;font-size:14px;color:var(--sub);opacity:.7}

.oempty{text-align:center;padding:52px 0;color:var(--sub)}
.oempty .emo{font-size:40px;margin-bottom:10px}
.onote{margin-top:18px;font-size:14px;color:var(--sub);line-height:1.7;text-align:center}

@media(max-width:680px){
  .ocard{padding:15px 16px;border-radius:16px}
  .oface{width:40px;height:40px;font-size:17px}
  .oname{font-size:19px}
  .oask{order:3}
  .ocount{margin-left:0;width:100%;order:4}
  .oitem{grid-template-columns:66px 1fr;gap:10px}
  .oitem .at{display:block;margin-left:0}
  .osearch{margin-left:0;flex:1 1 100%}
  .oform{padding:13px 14px}
}
</style>
</head>
<body>

<div id="sky"></div>
<header class="top"></header>

<main class="content"><div class="wrap">
  <div class="mhead">
    <div class="en">Orders</div>
    <h2>주문내역</h2>
  </div>

  <div class="osum" id="oSum"></div>
  <div class="olist" id="oList"></div>
  <p class="onote" id="oNote" style="display:none"></p>
</div></main>

<footer></footer>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
initPage('orders.html');

var oList = document.getElementById('oList');
var oSum  = document.getElementById('oSum');
var DONORS = [];            /* 지금 화면에 뿌린 후원자들 */

/* SOOP 프로필 사진 주소 규칙 — 아이디 앞 두 글자로 폴더가 나뉩니다 */
function faceUrl(id){
  if(!id || id.length < 2) return '';
  return 'https://profile.img.sooplive.com/LOGO/'+id.slice(0,2)+'/'+id+'/'+id+'.jpg';
}

/* 2026-08-02 15:01:50 → 8월 2일 */
function niceDate(s){
  var m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? (+m[2])+'월 '+(+m[3])+'일' : '';
}

/* 며칠 기다렸는지 */
function waited(s){
  var m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return 0;
  var d = new Date(+m[1], +m[2]-1, +m[3]);
  var now = new Date(); now.setHours(0,0,0,0);
  return Math.round((now - d) / 86400000);
}

var keyOf = function(it){ return it.order_idx+'::'+it.seq; };

/* ───────── 카드 ───────── */

function line(it, isDone){
  var name = it.resolved_label
    ? esc(it.label)+' <span class="swap">→ '+esc(it.resolved_label)+'</span>'
    : esc(it.label);
  var memo = it.memo ? '<span class="memo">'+esc(it.memo)+'</span>' : '';
  var at   = (isDone && it.done_at) ? '<span class="at">'+niceDate(it.done_at)+' 완료</span>' : '';
  var need = (!isDone && it.needs_input) ? '<span class="oneed">요청 필요</span>' : '';

  return '<div class="oitem" data-key="'+esc(keyOf(it))+'">'
       +   '<span class="d">'+niceDate(it.donated_at)+'</span>'
       +   '<span class="n">'+name+memo+need+at+'</span>'
       + '</div>';
}

function card(d){
  var face = faceUrl(d.donor_id);
  var initial = esc((d.donor_name||'?').trim().charAt(0));
  var askable = (d.items||[]).some(function(it){ return it.needs_input; });

  var chips = '<div class="ocount">'
    + '<button class="obadge" type="button" data-mode="pending">대기 '+d.pending+'</button>'
    + '<button class="obadge" type="button" data-mode="done">완료 '+d.done+'</button>'
    + '<button class="obadge" type="button" data-mode="all">전체</button>'
    + '</div>';

  var wait = '<div class="owait" data-list="pending">'
    + (d.items.length
        ? d.items.map(function(it){ return line(it, false); }).join('')
        : '<p class="oblank">남은 숙제가 없어요</p>')
    + '</div>';

  var done = '<div class="owait odlist" data-list="done">'
    + (d.done_items && d.done_items.length
        ? d.done_items.map(function(it){ return line(it, true); }).join('')
        : '<p class="oblank">아직 완료한 항목이 없어요</p>')
    + '</div>';

  return '<div class="ocard'+(d.pending?'':' clear')+'"'
       +   ' data-mode="'+(d.pending?'pending':'done')+'"'
       +   ' data-donor="'+esc(d.donor_id)+'">'
       +   '<div class="ohead">'
       +     '<div class="oface">'
       +       (face ? '<img src="'+esc(face)+'" alt="" loading="lazy" '
       +               +'onerror="this.parentNode.textContent=\''+initial+'\'">' : initial)
       +     '</div>'
       +     '<div><span class="oname">'+esc(d.donor_name||d.donor_id)+'</span>'
       +       '<span class="oid">'+esc(d.donor_id)+'</span></div>'
       +     (askable ? '<button class="oask" type="button">✎ 요청사항 작성하기</button>' : '')
       +     chips
       +   '</div>'
       +   '<div class="oauth">'
       +     '<p>방송에서 받은 <b>코드</b>를 넣으면 내 요청을 적을 수 있어요.</p>'
       +     '<div class="row">'
       +       '<input class="ocode" placeholder="받은 코드 입력" maxlength="16" '
       +         'autocomplete="off" spellcheck="false">'
       +       '<button class="obtn" type="button" data-go="1">확인</button>'
       +       '<button class="obtn sub" type="button" data-cancel="1">닫기</button>'
       +     '</div>'
       +     '<p class="err" style="display:none"></p>'
       +   '</div>'
       +   wait + done
       + '</div>';
}

/* ───────── 요청 작성 ───────── */

function formHtml(it, mine){
  var written = !!(mine.request && mine.request.trim());
  return '<div class="oform'+(written?' saved':'')+'" data-form="'+esc(keyOf(it))+'">'
       +   '<p class="guide">'+esc(mine.input_label || '원하시는 내용을 자유롭게 적어주세요')+'</p>'
       +   '<textarea maxlength="1000" placeholder="여기에 적어주세요">'+esc(mine.request||'')+'</textarea>'
       +   '<div class="act">'
       +     '<button class="obtn" type="button" data-save="1">저장</button>'
       +     '<span class="msg">'
       +       (mine.request_at ? '마지막 저장 '+String(mine.request_at).slice(5,16) : '')
       +     '</span>'
       +     '<span class="len"></span>'
       +   '</div>'
       + '</div>';
}

/* 코드가 맞으면 대기 항목 아래에 작성칸을 끼워 넣습니다 */
function openForms(cardEl, donor, data, code){
  var mineBy = {};
  (data.items||[]).forEach(function(m){ mineBy[m.order_idx+'::'+m.seq] = m; });

  var any = false;
  (donor.items||[]).forEach(function(it){
    var mine = mineBy[keyOf(it)];
    if(!mine) return;
    var row = cardEl.querySelector('.oitem[data-key="'+keyOf(it)+'"]');
    if(!row || row.nextElementSibling && row.nextElementSibling.classList.contains('oform')) return;
    row.insertAdjacentHTML('afterend', formHtml(it, mine));
    any = true;
  });

  cardEl.querySelectorAll('.oform').forEach(function(box){
    var ta  = box.querySelector('textarea');
    var ln  = box.querySelector('.len');
    var upd = function(){ ln.textContent = ta.value.length+' / 1000'; };
    ta.addEventListener('input', upd); upd();

    var btn = box.querySelector('[data-save]');
    btn.addEventListener('click', function(){ saveReq(box, code, btn); });
  });

  return any;
}

async function saveReq(box, code, btn){
  var ta  = box.querySelector('textarea');
  var msg = box.querySelector('.msg');
  var p   = box.dataset.form.split('::');

  btn.disabled = true;
  msg.textContent = '저장 중…';
  msg.classList.remove('ok');
  try{
    var r = await fetch(API+'/roulette/my', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ code: code, order_idx: p[0], seq: Number(p[1]), request: ta.value })
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    msg.textContent = '저장했어요 🌿';
    msg.classList.add('ok');
    box.classList.toggle('saved', !!ta.value.trim());
  }catch(e){
    msg.textContent = '저장하지 못했어요';
  }
  btn.disabled = false;
}

async function unlock(cardEl){
  var donorId = cardEl.dataset.donor;
  var input   = cardEl.querySelector('.ocode');
  var err     = cardEl.querySelector('.oauth .err');
  var code    = input.value.trim().toUpperCase();

  var fail = function(t){ err.textContent = t; err.style.display = ''; };
  err.style.display = 'none';

  if(!/^[A-Z0-9]{4,16}$/.test(code)) return fail('코드를 다시 확인해 주세요');

  try{
    var res = await fetch(API+'/roulette/my?code='+encodeURIComponent(code)
                          +'&donor='+encodeURIComponent(donorId));
    if(res.status === 403) return fail('이 코드는 다른 분의 코드예요');
    if(res.status === 404 || res.status === 400) return fail('코드를 찾을 수 없어요');
    if(!res.ok) throw new Error('HTTP '+res.status);

    var data  = await res.json();
    var donor = DONORS.filter(function(x){ return x.donor_id === donorId; })[0];
    if(!donor) return fail('잠시 후 다시 시도해 주세요');

    cardEl.dataset.mode = 'pending';
    if(!openForms(cardEl, donor, data, code)) return fail('지금은 작성할 항목이 없어요');

    cardEl.dataset.open = '0';
    input.value = '';
  }catch(e){
    fail('잠시 후 다시 시도해 주세요');
  }
}

/* ───────── 목록 ───────── */

async function load(q){
  oList.innerHTML = '<div class="oempty">불러오는 중…</div>';
  try{
    var res = await fetch(API+'/roulette/donors'+(q?('?q='+encodeURIComponent(q)):''));
    if(!res.ok) throw new Error('HTTP '+res.status);
    var data = await res.json();
    DONORS = data.donors || [];

    if(DONORS.length === 0){
      oList.innerHTML = '<div class="oempty"><div class="emo">🌙</div>'
        + '<h3>'+(q ? '찾는 분이 없어요' : '아직 내역이 없어요')+'</h3></div>';
      return;
    }

    oList.innerHTML = DONORS.map(card).join('');

    oList.querySelectorAll('.ocard').forEach(function(c){
      c.querySelectorAll('.obadge').forEach(function(b){
        b.addEventListener('click', function(){ c.dataset.mode = b.dataset.mode; });
      });

      var ask = c.querySelector('.oask');
      if(ask) ask.addEventListener('click', function(){
        c.dataset.open = '1';
        c.querySelector('.ocode').focus();
      });

      var cancel = c.querySelector('[data-cancel]');
      if(cancel) cancel.addEventListener('click', function(){ c.dataset.open = '0'; });

      var go = c.querySelector('[data-go]');
      if(go) go.addEventListener('click', function(){ unlock(c); });

      var codeEl = c.querySelector('.ocode');
      if(codeEl) codeEl.addEventListener('keydown', function(e){
        if(e.key === 'Enter') unlock(c);
      });
    });

    var top = DONORS[0];
    var note = document.getElementById('oNote');
    if(top && top.pending && top.oldest_pending){
      var days = waited(top.oldest_pending);
      note.style.display = '';
      note.textContent = days > 0
        ? '가장 오래 기다린 숙제는 ' + days + '일째예요. 위에서부터 순서대로 해드릴게요 🌿'
        : '오늘 들어온 숙제부터 차근차근 해드릴게요 🌿';
    }
  }catch(e){
    oList.innerHTML = '<div class="oempty">잠시 후 다시 시도해 주세요</div>';
  }
}

async function loadSum(){
  try{
    var r = await fetch(API+'/roulette/stats');
    var s = await r.json();
    oSum.innerHTML =
        '<span class="ochip">남은 숙제 <b>'+(s.pending||0)+'</b></span>'
      + '<span class="ochip done">완료 <b>'+(s.done||0)+'</b></span>'
      + '<span class="osearch"><input id="oQ" placeholder="닉네임 검색" autocomplete="off"></span>';

    var el = document.getElementById('oQ'), t;
    el.addEventListener('input', function(){
      clearTimeout(t);
      t = setTimeout(function(){ load(el.value.trim()); }, 300);
    });
  }catch(e){ }
}

loadSum();
load('');
</script>
</body>
</html>
